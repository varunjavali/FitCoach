services:
  - type: web
    name: fitcoach-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        sync: false # set manually in Render dashboard (your Atlas URI)
      - key: JWT_SECRET
        sync: false # set manually in Render dashboard
      - key: PORT
        value: 5000
